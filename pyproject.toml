[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobilenet-enterprise"
version = "0.1.0"
description = "HSMF-Net model definitions and paired RGB/HSI data processing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "PyYAML>=6.0.1",
  "numpy>=1.26.0",
  "Pillow>=10.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
