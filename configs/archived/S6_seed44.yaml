seed: 44
device: auto
output_dir: F:\00 Paper-Summary\1.HSMF-Net-Paper\01-Experiments\MobileNet_Ablation_Code-V3\artifacts\sci_s1s8_tvt701515_5seed_v2_2026-09-22
experiment_name: sci_s6_fusion_hybrid_cross_attn_spa50_seed44
model:
  name: rgb_hsi_attention
  num_classes: 4
  width_mult: 1.0
  dropout: 0.35
  input_channels: 3
  fusion:
    type: cross_attention
    hidden_dim: 256
    attention_heads: 4
    attention_dropout: 0.1
    rgb_variant: v3_small
    hsi_backbone: hybrid_3d2d
    hsi_variant: small
    hsi_bands: 50
    hsi_stem3d_channels: '[16, 32]'
    hsi_spectral_bins: 8
    hsi_tiny_spatial_enabled: true
    hsi_classifier_hidden: 192
pretrained:
  enabled: true
  source: torchvision
data:
  name: wheat_seed_fusion
  root: data/wheat-seed
  image_size: 224
  batch_size: 16
  num_workers: 2
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  randaugment: true
  randaugment_num_ops: 2
  randaugment_magnitude: 9
  random_erasing_p: 0.25
  rgb_root: data/wheat-seed
  hsi_root: data/wheat-seed
  hsi_image_size: 24
  hsi_bands: 50
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  exclude_classes:
  - XN9112
  pair_key: stem
  sync_spatial_flip_prob: 0.5
  roi_crop_enabled: false
  roi_threshold_percentile: 80
  roi_margin: 1
  rgb_augmentation:
    randaugment: true
    randaugment_num_ops: 2
    randaugment_magnitude: 9
    random_erasing_p: 0.15
  band_selection:
    method: spa
    num_bands: 50
    exclude_head: 10
    exclude_tail: 15
    use_preprocessed_spectra: true
    cache_path: data/processed/selected_bands_spa_50_e10_t15_smooth.npy
  normalization:
    per_band: true
    stats_cache_path: data/processed/hsi_band_stats_spa_50_e10_t15_smooth_fg_t70.npz
  preprocessing_cache:
    enabled: true
    root: data/processed/hsi_tensor_cache_sci_s1s6_v1
  hsi_augmentation:
    enabled: true
    spatial_flip_prob: 0.0
    spatial_roll_max: 1
    spectral_noise_std: 0.003
    spectral_scale_min: 0.97
    spectral_scale_max: 1.03
    band_dropout_prob: 0.2
    band_dropout_max_fraction: 0.08
train:
  epochs: 100
  amp: false
  deterministic: false
  save_every: 5
  label_smoothing: 0.05
  early_stopping_patience: 18
  warmup_epochs: 10
  ema_enabled: true
  ema_decay: 0.999
  ema_tau: 2000
  ema_eval_start_epoch: 15
  ema_eval_min_updates: 1500
  ema_eval_after_warmup_epochs: 3
  ema_switch_max_drop: 0.01
  loss_name: focal
  focal_gamma: 1.5
  grad_clip_norm: 0.5
  abort_on_non_finite: false
  class_weighting_enabled: true
  class_weight_power: 1.0
  class_weight_target_boost:
    ZM379: 1.4
  early_stopping_min_epoch: 100
  mixup_alpha: 0.1
  mixup_prob: 0.5
  smoke_monitor:
    enabled: true
    start_epoch: 10
    majority_ratio_threshold: 0.8
    majority_only_threshold: 0.98
    entropy_threshold: 0.45
    abort_on_collapse: false
optimizer:
  name: adamw
  lr: 0.0005
  weight_decay: 0.0008
scheduler:
  name: cosine
  t_max: 100
  eta_min: 5e-6
logging:
  log_interval: 50
  tensorboard: true
  show_progress_bar: true
  show_batch_log: false
eval:
  checkpoint_preference: best
